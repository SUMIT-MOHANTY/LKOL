<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Dashboard</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <header class="header">
        <h1 class="header__title">Welcome to Agent Dashboard</h1>
    </header>

    <main class="main">
        <section class="main__hero">
            <h2 class="main__hero--title">Static-First Deployment</h2>
            <p class="main__hero--text">This project serves static content with optional Flask backend.</p>
        </section>

        <section class="main__features">
            <div class="feature-card">
                <h3 class="feature-card__title">Responsive Design</h3>
                <p class="feature-card__description">Built with modern CSS for all devices.</p>
            </div>
            <div class="feature-card">
                <h3 class="feature-card__title">Static Serving</h3>
                <p class="feature-card__description">No Flask required for deployment.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2024 Agent Deployment</p>
    </footer>
</body>
</html>
