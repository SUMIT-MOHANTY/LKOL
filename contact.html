<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Contact page for static site">
    <title>Contact - Static Site</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="assets/images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="assets/images/favicon.ico" type="image/x-icon">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <ul class="navbar__list">
                <li class="navbar__item">
                    <a href="index.html" class="navbar__link">Home</a>
                </li>
                <li class="navbar__item">
                    <a href="about.html" class="navbar__link">About</a>
                </li>
                <li class="navbar__item">
                    <a href="contact.html" class="navbar__link navbar__link--active">Contact</a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main-content">
        <section class="contact">
            <div class="contact__container">
                <h1 class="contact__title">Contact Us</h1>
                <form class="contact__form" action="mailto:info@example.com" method="post">
                    <div class="form__group">
                        <label class="form__label" for="name">Name</label>
                        <input type="text" id="name" name="name" class="form__input" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="email">Email</label>
                        <input type="email" id="email" name="email" class="form__input" required>
                    </div>
                    <div class="form__group">
                        <label class="form__label" for="message">Message</label>
                        <textarea id="message" name="message" class="form__textarea" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="form__button">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p class="site-footer__text"> 2024 Static Site. All rights reserved.</p>
    </footer>
</body>
</html>
